spring.application.name=LedgerService


server.port=0
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094, localhost:9096
spring.kafka.consumer.group-id=transfer-created-events
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_DB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true